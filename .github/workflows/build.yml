name: build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: grinder-binary-jdk${{ matrix.java }}
          path: grinder/target/*-binary.zip

  # Builds the console image from the JDK 21 zip on every run, and pushes it
  # to docker.io/cossme/grinder on a version tag (v4.1.0 -> cossme/grinder:4.1.0).
  docker:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grinder-binary-jdk21
          path: docker
      # The image tag is the version on a v* tag and the short commit otherwise;
      # a pull request's ref name ("8/merge") is not a valid image tag.
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - run: docker build docker/ -t cossme/grinder:${{ steps.tag.outputs.tag }}
      - run: docker image inspect --format '{{.Size}}' cossme/grinder:${{ steps.tag.outputs.tag }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: docker push cossme/grinder:${{ steps.tag.outputs.tag }}
