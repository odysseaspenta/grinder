name: release

# Publishes the artifacts of a version tag (v4.1.0, v4.1.0-rc1) to the Maven
# Central Portal, signed. The tag names the version; the poms are stamped
# with it before the build, so the version test and the zip carry it.
#
# Repository secrets the operator supplies:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD  a Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE     the signing key (ASCII armoured)
#
# The deployment stops at "validated" in the Portal; the operator releases it
# there, or runs with -Dcentral.autoPublish=true to publish straight away.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn -B versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false
      - run: mvn -B -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
